@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f0f0f0;color:#1f2937;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
.card{background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.alerta{font-weight:800;font-size:18px;line-height:1.3;text-align:center;color:#b80a12;margin-bottom:10px}
.texto{font-size:15px;line-height:1.5;text-align:center;color:#374151;margin-bottom:14px}
.flecha{font-weight:800;text-align:center;color:#b80a12;font-size:20px;margin:6px 0 10px}
.flecha.chica{font-size:15px;color:#374151;font-weight:600;margin-top:10px}
.video{width:100%;max-width:400px;margin:0 auto;border-radius:10px;overflow:hidden;background:#000}
.oculto{display:none!important}
.aparece{animation:apa .5s ease both}
@keyframes apa{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reloj{margin:16px auto 0;background:#fff3f3;border:1px solid #fecaca;color:#b80a12;border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:14px}
.reloj b{font-variant-numeric:tabular-nums;font-size:18px}
.oferta{margin-top:16px;text-align:center}
.oferta img{width:100%;max-width:300px;border-radius:12px;display:block;margin:0 auto 10px}
.oferta h2{font-size:19px;font-weight:800;margin-bottom:4px}
.precios{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:6px 0 2px}
.precios s{color:#9ca3af;font-size:15px}
.precios strong{font-size:30px;font-weight:800;color:#111827}
.etiqueta{display:inline-block;background:#dc2626;color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:17px 12px;margin-top:14px;color:#fff;font:800 16px/1.25 Poppins,system-ui,sans-serif;letter-spacing:.2px;cursor:pointer;box-shadow:0 6px 16px rgba(16,147,62,.28);animation:late 1.6s ease-in-out infinite}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.btn[disabled]{opacity:.6;animation:none;cursor:wait}
.no{display:block;width:100%;background:none;border:0;margin-top:12px;color:#6b7280;font:500 14px Poppins,system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
.urgencia{margin-top:10px;font-size:13px;color:#b45309;font-weight:600;text-align:center}
.sellos{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:#4b5563;font-weight:500}
#kash-aviso a{font-weight:700}
